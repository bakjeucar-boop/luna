name: Test

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest and update snapshots
        run: python -m pytest -q --snapshot-update

      - name: Commit generated snapshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/snake-textual'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "test: add Textual snapshot baselines"
            git push origin HEAD:feat/snake-textual
          fi
